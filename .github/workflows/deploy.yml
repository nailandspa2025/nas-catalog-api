name: Build, Push & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore --configuration Release

      - name: Publish project
        run: dotnet publish -c Release -o publish

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nas-catalog-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/nas-catalog-api:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-push-deploy
    steps:
      - name: SSH into Server & Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_SERVER_HOST }}
          username: admin
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          # password: ${{ secrets.SERVER_PASSWORD }}

          script: |
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/nas-catalog-api:${{ github.sha }}
            docker network inspect nas-net >/dev/null 2>&1 || docker network create nas-net
            docker stop nas-catalog-api || true
            docker rm nas-catalog-api || true
            docker run -d --restart=always --pull=always --name nas-catalog-api --network nas-net -p 6004:6004 ghcr.io/${{ github.repository_owner }}/nas-catalog-api:${{ github.sha }}
